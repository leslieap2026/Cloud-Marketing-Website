<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 540" role="img" aria-label="Soft, realistic white clouds drifting across a bright blue sky">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1f86d6"/>
      <stop offset="45%" stop-color="#54b6e6"/>
      <stop offset="100%" stop-color="#cdeefa"/>
    </linearGradient>
    <radialGradient id="sun" cx="50%" cy="42%" r="55%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="45%" stop-color="#eaf7ff" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#eaf7ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cloud" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="65%" stop-color="#f3f8fc"/>
      <stop offset="100%" stop-color="#cfe0ee"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5"/>
    </filter>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="12"/>
    </filter>
    <filter id="hi" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>
    <clipPath id="card"><rect x="0" y="0" width="860" height="540" rx="16"/></clipPath>
  </defs>

  <g clip-path="url(#card)">
    <rect x="0" y="0" width="860" height="540" fill="url(#sky)"/>
    <circle cx="440" cy="230" r="240" fill="url(#sun)"/>

    <!-- secondary cloud, upper left -->
    <g>
      <g filter="url(#shadow)" fill="#5c97c2" opacity="0.35">
        <ellipse cx="190" cy="204" rx="92" ry="26"/>
        <circle cx="170" cy="184" r="34"/>
        <circle cx="210" cy="176" r="40"/>
      </g>
      <g filter="url(#soft)" fill="url(#cloud)">
        <ellipse cx="188" cy="196" rx="78" ry="22"/>
        <circle cx="150" cy="186" r="28"/>
        <circle cx="185" cy="166" r="38"/>
        <circle cx="226" cy="182" r="30"/>
      </g>
    </g>

    <!-- secondary cloud, upper right -->
    <g>
      <g filter="url(#shadow)" fill="#5c97c2" opacity="0.32">
        <ellipse cx="690" cy="234" rx="92" ry="26"/>
        <circle cx="690" cy="206" r="40"/>
        <circle cx="726" cy="218" r="32"/>
      </g>
      <g filter="url(#soft)" fill="url(#cloud)">
        <ellipse cx="688" cy="224" rx="78" ry="22"/>
        <circle cx="652" cy="214" r="30"/>
        <circle cx="686" cy="196" r="38"/>
        <circle cx="724" cy="212" r="30"/>
      </g>
    </g>

    <!-- main cloud, center -->
    <g>
      <g filter="url(#shadow)" fill="#5c97c2" opacity="0.4">
        <ellipse cx="450" cy="344" rx="210" ry="46"/>
        <circle cx="360" cy="288" r="78"/>
        <circle cx="452" cy="276" r="92"/>
        <circle cx="548" cy="296" r="72"/>
      </g>
      <g filter="url(#soft)" fill="url(#cloud)">
        <ellipse cx="450" cy="328" rx="196" ry="42"/>
        <circle cx="300" cy="302" r="56"/>
        <circle cx="360" cy="270" r="74"/>
        <circle cx="452" cy="258" r="86"/>
        <circle cx="542" cy="274" r="66"/>
        <circle cx="606" cy="302" r="50"/>
      </g>
      <g filter="url(#hi)" fill="#ffffff" opacity="0.7">
        <circle cx="372" cy="248" r="30"/>
        <circle cx="452" cy="236" r="36"/>
      </g>
    </g>
  </g>
</svg>
