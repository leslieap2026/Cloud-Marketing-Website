<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 460" role="img" aria-label="Marketing analytics dashboard showing campaign performance">
  <defs>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1e6fff"/>
      <stop offset="100%" stop-color="#0cc0df"/>
    </linearGradient>
    <linearGradient id="area" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0cc0df" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#0cc0df" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- card -->
  <rect x="0" y="0" width="720" height="460" rx="16" fill="#ffffff"/>

  <!-- header -->
  <text x="48" y="78" font-family="Poppins, Arial, sans-serif" font-size="22" font-weight="700" fill="#0f172a">Campaign performance</text>
  <rect x="556" y="56" width="116" height="32" rx="16" fill="#e7faff"/>
  <text x="614" y="77" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#0aa3bd">+62% &#9650;</text>

  <!-- gridlines -->
  <line x1="48" y1="180" x2="430" y2="180" stroke="#eef2f8" stroke-width="1"/>
  <line x1="48" y1="240" x2="430" y2="240" stroke="#eef2f8" stroke-width="1"/>
  <line x1="48" y1="300" x2="430" y2="300" stroke="#eef2f8" stroke-width="1"/>

  <!-- area + line chart -->
  <path d="M48,275 L110,260 L172,280 L234,225 L296,235 L358,180 L430,150 L430,300 L48,300 Z" fill="url(#area)"/>
  <polyline points="48,275 110,260 172,280 234,225 296,235 358,180 430,150" fill="none" stroke="url(#line)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <g fill="#1e6fff">
    <circle cx="48" cy="275" r="4"/>
    <circle cx="110" cy="260" r="4"/>
    <circle cx="172" cy="280" r="4"/>
    <circle cx="234" cy="225" r="4"/>
    <circle cx="296" cy="235" r="4"/>
    <circle cx="358" cy="180" r="4"/>
    <circle cx="430" cy="150" r="4"/>
  </g>

  <!-- donut -->
  <circle cx="572" cy="205" r="56" fill="none" stroke="#eef2f8" stroke-width="16"/>
  <circle cx="572" cy="205" r="56" fill="none" stroke="url(#line)" stroke-width="16" stroke-linecap="round" stroke-dasharray="253 352" transform="rotate(-90 572 205)"/>
  <text x="572" y="200" text-anchor="middle" font-family="Poppins, Arial, sans-serif" font-size="26" font-weight="800" fill="#0f172a">4.2x</text>
  <text x="572" y="224" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#64748b">ROAS</text>

  <!-- KPI chips -->
  <g font-family="Arial, sans-serif">
    <rect x="48" y="336" width="176" height="76" rx="14" fill="#f5f9ff" stroke="#e9eef6"/>
    <text x="68" y="368" font-size="11" fill="#64748b">Qualified leads / mo</text>
    <text x="68" y="400" font-family="Poppins, Arial, sans-serif" font-size="24" font-weight="800" fill="#0f172a">318</text>

    <rect x="240" y="336" width="176" height="76" rx="14" fill="#f5f9ff" stroke="#e9eef6"/>
    <text x="260" y="368" font-size="11" fill="#64748b">People reached</text>
    <text x="260" y="400" font-family="Poppins, Arial, sans-serif" font-size="24" font-weight="800" fill="#0f172a">3.1M</text>

    <rect x="432" y="336" width="176" height="76" rx="14" fill="#f5f9ff" stroke="#e9eef6"/>
    <text x="452" y="368" font-size="11" fill="#64748b">Conversion rate</text>
    <text x="452" y="400" font-family="Poppins, Arial, sans-serif" font-size="24" font-weight="800" fill="#0f172a">+47%</text>
  </g>
</svg>
